<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>登录 - 经营管理系统</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: "Microsoft YaHei", sans-serif; background: #f5f5f5; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
    .login-box { background: #fff; padding: 32px; border-radius: 8px; box-shadow: 0 2px 12px rgba(0,0,0,0.1); width: 320px; }
    h2 { text-align: center; margin-bottom: 24px; color: #333; }
    .form-group { margin-bottom: 16px; }
    label { display: block; margin-bottom: 6px; color: #555; font-size: 14px; }
    input { width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 4px; font-size: 14px; }
    input:focus { border-color: #409eff; outline: none; }
    button { width: 100%; padding: 10px; background: #409eff; color: #fff; border: none; border-radius: 4px; font-size: 16px; cursor: pointer; }
    button:hover { background: #66b1ff; }
    .msg { margin-top: 12px; text-align: center; font-size: 14px; min-height: 20px; }
    .msg.error { color: #f56c6c; }
    .msg.success { color: #67c23a; }
  </style>
</head>
<body>
  <div class="login-box">
    <h2>经营管理系统</h2>
    <div class="form-group">
      <label>账号</label>
      <input type="text" id="username" placeholder="请输入账号">
    </div>
    <div class="form-group">
      <label>密码</label>
      <input type="password" id="password" placeholder="请输入密码">
    </div>
    <button id="loginBtn">登录</button>
    <div class="msg" id="msg"></div>
  </div>
  <script>
    const msgEl = document.getElementById('msg');
    // 已登录则直接跳主页
    if (localStorage.getItem('token')) {
      location.href = 'index.html';
    }
    document.getElementById('loginBtn').addEventListener('click', async () => {
      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value.trim();
      if (!username || !password) {
        msgEl.textContent = '账号和密码不能为空';
        msgEl.className = 'msg error';
        return;
      }
      try {
        const res = await fetch('/api/users/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password })
        });
        const data = await res.json();
        if (data.code === 0) {
          localStorage.setItem('token', data.data.token);
          msgEl.textContent = '登录成功，正在跳转...';
          msgEl.className = 'msg success';
          setTimeout(() => location.href = 'index.html', 500);
        } else {
          msgEl.textContent = data.message || '登录失败';
          msgEl.className = 'msg error';
        }
      } catch (e) {
        msgEl.textContent = '网络错误，请检查服务是否启动';
        msgEl.className = 'msg error';
      }
    });
    // 回车键登录
    document.getElementById('password').addEventListener('keydown', e => {
      if (e.key === 'Enter') document.getElementById('loginBtn').click();
    });
  </script>
</body>
</html>
